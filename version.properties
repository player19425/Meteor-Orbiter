# Minecraft 1.21.11, the last release before the year-based 26.x scheme.
#
# This target needs two things the 26.x ones do not:
#   * Java 21 instead of 25
#   * Loom's remapping plugin, because 1.21.11 is still obfuscated and Meteor's
#     own access widener is written in the intermediary namespace
#
# Meteor 1.21.11 also ships no DisplayItemUtils, no
# ServerboundMovePlayerPacketAccessor and no IServerboundMovePlayerPacket, and
# its Category constructor takes an ItemStack where the 26.x line takes none.

mc=1.21.11
meteor=1.21.11-SNAPSHOT

jdk=21
loader=0.19.3

# Compile-time only, required by the merged Minecraft jar.
resource-loader=1.0.10+78c8b4663e
fabric-api-base=1.0.5+4ebb5c083e