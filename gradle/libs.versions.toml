# Build-time only. Everything that differs per Minecraft version (minecraft,
# meteor, the Fabric API pieces the merged jar needs at compile time) lives in
# versions/<target>/version.properties, NOT here.
#
# Loom ships two plugin ids since 1.14:
#   net.fabricmc.fabric-loom        -> non-obfuscated Minecraft (the 26.x line)
#   net.fabricmc.fabric-loom-remap  -> obfuscated Minecraft (1.21.11 and older)
# A module picks whichever matches its target.

[versions]
loom = "1.17.19"

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }